name: Android CICD Testing Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Android Build Pipeline
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2
          components: |
            platform-tools
            platforms;android-33

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print environment (debug)
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew -version

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean Project (Recommended for CI)
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK (Assemble + Test) with diagnostics
        run: ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD-Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

      # Keystore: always attempt to create app/sync_note.jks if secret exists.
      # NOTE: Removed 'if: ${{ secrets.KEYSTORE_BASE64 != '' }}' because workflow parsing
      # cannot evaluate 'secrets' in an 'if' expression at that stage (caused the error).
      - name: Download Keystore from Secret and Write to app/
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "No KEYSTORE_BASE64 secret provided; skipping keystore creation"
          else
            mkdir -p app
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/sync_note.jks
            echo "Keystore written to app/sync_note.jks"
            ls -la app | sed -n '1,200p'
          fi

      - name: Build Release APK (with diagnostics)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/sync_note.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # If keystore secrets are provided, ensure the file exists where Gradle expects it
          if [ -n "${KEYSTORE_PASSWORD}" ]; then
            if [ ! -f "${KEYSTORE_PATH}" ]; then
              echo "Keystore not found at ${KEYSTORE_PATH}"
              echo "PWD: $PWD"
              ls -la
              exit 1
            else
              echo "Using keystore at ${KEYSTORE_PATH}"
            fi
          else
            echo "No keystore password provided; assuming release build is not signed with a repo keystore"
          fi
          ./gradlew assembleRelease --stacktrace --info --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD-Release.apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0

      - name: Upload Gradle Daemon Logs (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            ~/.gradle/daemon
            ~/.gradle/caches
          retention-days: 3
