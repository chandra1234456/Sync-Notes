name: Android CI/CD

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'   # Example: v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # 1. Checkout Code
      # ------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------
      # 2. Setup JDK
      # ------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ------------------------------
      # 3. Setup Android SDK
      # ------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ------------------------------
      # 4. Cache Gradle to speed up CI
      # ------------------------------
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ------------------------------
      # 5. Make gradlew executable
      # ------------------------------
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ------------------------------
      # 6. Run Tests (Unit tests)
      # ------------------------------
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # ------------------------------
      # 7. Build Release APK and AAB
      # ------------------------------
      - name: Build release artifacts
        run: ./gradlew clean assembleRelease bundleRelease

      # ------------------------------
      # 8. Upload build artifacts to GitHub Actions (for download)
      # ------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # ------------------------------
      # 9. Publish Release when tagging (v1.0.0)
      # ------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
