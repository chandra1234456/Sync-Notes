name: Android CICD Testing Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Android Build Pipeline
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2
          components: |
            platform-tools
            platforms;android-33

      # Ensure keystore exists BEFORE any gradle command (gradle reads STORE_FILE during configuration)
      - name: Create or Decode Keystore into app/sync_note.jks
        run: |
          set -euo pipefail
          mkdir -p app
          # Use the repository's keystore secret SYNC_NOTE_KEYSTORE if provided (base64)
          if [ -n "${{ secrets.SYNC_NOTE_KEYSTORE }}" ]; then
            echo "Decoding SYNC_NOTE_KEYSTORE into app/sync_note.jks"
            echo "${{ secrets.SYNC_NOTE_KEYSTORE }}" | base64 --decode > app/sync_note.jks
            chmod 600 app/sync_note.jks
            echo "Keystore created from SYNC_NOTE_KEYSTORE secret at app/sync_note.jks"
          else
            # No base64 keystore secret provided: generate a temporary keystore
            # (matches gradle.properties: STORE_PASSWORD=android, KEY_PASSWORD=android, KEY_ALIAS=android)
            echo "No SYNC_NOTE_KEYSTORE secret found. Generating temporary keystore app/sync_note.jks"
            keytool -genkeypair \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore app/sync_note.jks \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            chmod 600 app/sync_note.jks
            echo "Generated keystore at app/sync_note.jks with alias=android"
          fi
          ls -la app | sed -n '1,200p'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print environment (debug)
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew -version

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean Project (Recommended for CI)
        run: ./gradlew clean --no-daemon --stacktrace --info

      - name: Build Debug APK (Assemble + Test) with diagnostics
        run: ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD-Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

      - name: Build Release APK (with diagnostics)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/sync_note.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            if [ ! -f "${KEYSTORE_PATH}" ]; then
              echo "Keystore not found at ${KEYSTORE_PATH}"
              ls -la
              exit 1
            fi
            echo "Using keystore at ${KEYSTORE_PATH}"
          else
            echo "No KEYSTORE_PASSWORD provided; proceeding (release may be unsigned or use local keystore)"
          fi
          ./gradlew assembleRelease --stacktrace --info --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD-Release.apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0

      - name: Upload Gradle Daemon Logs (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            ~/.gradle/daemon
            ~/.gradle/caches
          retention-days: 3
