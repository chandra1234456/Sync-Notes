name: Android CICD Testing Build
on:
  push:
    branches: [ "master" ]     # Trigger CI when code is pushed to master
  pull_request:
    branches: [ "master" ]     # Trigger CI for pull requests to master


jobs:
  build:
    name: Android Build Pipeline
    runs-on: ubuntu-latest     # GitHub runner with Android SDK tools preinstalled

    steps:


      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Setup JDK 17 for Android Narwhal
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'     # Required for AGP 8.x+ (Narwhal)
          distribution: 'adopt'


      - name: Make gradlew executable
        run: chmod +x ./gradlew


      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-


      - name: Clean Project (Recommended for CI)
        run: ./gradlew clean

      - name: Build Project (Assemble + Test)
        run: ./gradlew build

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD-Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # You can download the APK from GitHub Actions → Artifacts
          compression-level: 0      # 👉 prevents GitHub from zipping the APK