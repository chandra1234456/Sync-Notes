name: Android CICD Testing Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Android Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Setup JDK 17 for Android Narwhal
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean Project (Recommended for CI)
        run: ./gradlew clean

      # ========================== Debug APK ==========================
      - name: Build Debug APK (Assemble + Test)
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD-Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

      # ========================== Release APK ==========================
      - name: Download Keystore from Secret and Write to File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > sync_note.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/sync_note.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD-Release.apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0